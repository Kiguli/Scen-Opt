name: Deploy Flask project

on:
  push:
    branches:
      - master

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Configure SSH

        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{secrets.SSH_KNOWN_HOSTS}}

        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/github
          chmod 600 ~/.ssh/github
          cat >> ~/.ssh/config <<EOF
          Host target
            Hostname $SSH_HOST
            User $SSH_USER
            Port 22
            IdentityFile ~/.ssh/github
            StrictHostKeyChecking no
            LogLevel ERROR
          EOF

      - name: Update app
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh target << 'EOF'
            cd /srv/scen-o-con.woodingben.com/current
            git reset --hard HEAD
            git pull
            cd ..
            source venv/bin/activate

            # Verify Python version
            python_version=$(python -V 2>&1 | cut -d' ' -f2)
            if [[ ! "$python_version" =~ ^3\.12\.7 ]]; then
              echo "Warning: Python version is $python_version, expected 3.12.7"
              echo "Please update Python using pyenv: pyenv install 3.12.7"
            fi

            cd current
            pip install -r requirements.txt
          EOF

      - name: Reload NGINX
        run: |
          ssh target << 'EOF'
            sudo nginx -s reload
          EOF
