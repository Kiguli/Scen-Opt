name: Publish Docker image

on:
  # Run on every push to master and on tag pushes like v2, v2.1, v2.1.3.
  push:
    branches: [master]
    tags: ["v*"]
  # Manual trigger from the Actions tab.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/scen-opt

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # allow pushing to ghcr.io under this account
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Buildx is needed for multi-arch builds and layer caching.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag :latest on master, and use the raw ref/sha on tags.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Publish for x86_64 Linux hosts. Add ,linux/arm64 here if you
          # also want ARM (e.g. M-series Mac / Pi 4+) — it roughly doubles
          # build time because there's no native arm64 runner on public GH.
          platforms: linux/amd64
